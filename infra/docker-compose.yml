services:
  zookeeper:
    image: debezium/zookeeper:2.5
    ports:
      - "2181:2181"

  kafka:
    image: debezium/kafka:2.5
    ports:
      - "9092:9092"
    environment:
       KAFKA_BROKER_ID: 1
       ZOOKEEPER_CONNECT: zookeeper:2181
       KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092, EXTERNAL://0.0.0.0:9092
       KAFKA_ADVERTISED_LISTENERS: INTERNAL://KAFKA:29092,EXTERNAL://192.168.0.33:9092
       KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT, EXTERNAL:PLAINTEXT
       KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    depends_on:
      - zookeeper

  postgres:
    image: debezium/postgres:15
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=lina
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  connect:
    image: debezium/connect:2.5
    ports:
      - "8083:8083"
    environment:
      - BOOTSTRAP_SERVERS=192.168.0.33:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=lina_configs
      - OFFSET_STORAGE_TOPIC=lina_offsets
      - STATUS_STORAGE_TOPIC=lina_statuses
      - KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - KEY_CONVERTER_SCHEMAS_ENABLE=false
      - VALUE_CONVERTER_SCHEMAS_ENABLE=false
      - CONNECT_REST_ADVERTISED_HOST_NAME=connect
      - CONNECT_PLUGIN_PATH=/kafka/connect,/debezium-connector-postgres
    depends_on:
      - kafka
    volumes:
      - kafka_data:/kafka/kafka-logs
volumes:
  pgdata:
  kafka_data:
